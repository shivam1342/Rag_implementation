<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: #212121;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 120, 120, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(120, 120, 120, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(120, 120, 120, 0.03) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 24px 32px;
            border-bottom: 1px solid #3a3a3a;
            background: #252525;
        }

        h1 {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.875em;
            font-weight: 400;
        }

        .chat-area {
            padding: 32px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }

        .input-section {
            padding: 24px 32px;
            border-top: 1px solid #3a3a3a;
            background: #252525;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 14px 16px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 52px;
            max-height: 200px;
            color: #e0e0e0;
            transition: border-color 0.2s, background 0.2s;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #6b7280;
        }

        textarea:focus {
            outline: none;
            border-color: #525252;
            background: #1f1f1f;
        }

        button {
            padding: 14px 24px;
            background: #f5f5f5;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            height: 52px;
        }

        button:hover:not(:disabled) {
            background: #ffffff;
            border-color: #d4d4d4;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background: #3a3a3a;
            color: #6b7280;
            border-color: #3a3a3a;
            cursor: not-allowed;
        }

        .message {
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-label {
            font-size: 0.8em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .user-message {
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            padding: 16px 20px;
            border-radius: 12px;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .assistant-message {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 16px 20px;
            border-radius: 12px;
            color: #e0e0e0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            color: #9ca3af;
            padding: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #3a3a3a;
            border-top: 2px solid #9ca3af;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            padding: 14px 18px;
            border-radius: 8px;
            color: #fca5a5;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9em;
        }

        .error.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 0.9em;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 RAG System</h1>
            <p class="subtitle">Ask questions about your documents</p>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">Start a conversation</div>
                <div class="empty-state-subtext">Ask me anything about your documents</div>
            </div>
        </div>

        <div class="input-section">
            <div class="error" id="error"></div>
            <div class="input-wrapper">
                <textarea id="query" placeholder="Type your question here..." rows="1"></textarea>
                <button onclick="askQuestion()" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const emptyState = document.getElementById('emptyState');
        const queryInput = document.getElementById('query');
        const errorDiv = document.getElementById('error');
        const sendButton = document.getElementById('sendButton');

        // Auto-resize textarea
        queryInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        async function askQuestion() {
            const query = queryInput.value.trim();

            if (!query) {
                showError('Please enter a question.');
                return;
            }

            // Hide empty state
            emptyState.style.display = 'none';
            errorDiv.classList.remove('show');

            // Add user message
            addMessage('You', query, 'user-message');

            // Clear input
            queryInput.value = '';
            queryInput.style.height = 'auto';

            // Show loading
            const loadingId = addLoading();
            sendButton.disabled = true;

            try {
                const response = await fetch('/rag', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (response.ok) {
                    addMessage('Assistant', data.answer, 'assistant-message');
                } else {
                    showError(data.error || 'An error occurred.');
                }
            } catch (error) {
                removeLoading(loadingId);
                showError('Failed to connect to the server.');
            } finally {
                sendButton.disabled = false;
                queryInput.focus();
            }
        }

        function addMessage(label, content, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="message-label">${label}</div>
                <div class="${className}">${escapeHtml(content)}</div>
            `;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function addLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading show';
            loadingDiv.innerHTML = '<div class="spinner"></div> Thinking...';
            const id = 'loading-' + Date.now();
            loadingDiv.id = id;
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const loadingDiv = document.getElementById(id);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter to submit (Shift+Enter for new line)
        queryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });

        // Focus input on load
        queryInput.focus();
    </script>
</body>
</html>
